<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">OmniHarness</title>
  <desc id="desc">A local-first workspace connecting models, tools, and evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1c2e3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8296a5" opacity=".22"/></pattern>
    <clipPath id="card"><rect width="1400" height="360" rx="24"/></clipPath>
  </defs>
  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="24" fill="url(#dots)"/>
  <g clip-path="url(#card)"><circle cx="1180" cy="55" r="250" fill="#3ec6b8" opacity=".06"/>
  <circle cx="1355" cy="330" r="180" fill="#77a9ff" opacity=".07"/></g>
  <rect x="72" y="64" width="54" height="54" rx="15" fill="url(#accent)"/>
  <path d="M88 99v-12h10v-7h12v7h-8v12m-14 0h-5v8h12v-8h-7m14 0h-4v8h12v-8h-8" fill="none" stroke="#102533" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="104" fill="#e9f3f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-.5">OmniHarness</text>
  <text x="72" y="187" fill="#f5f8fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1">Build with context.</text>
  <text x="72" y="242" fill="#f5f8fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1">Work with confidence.</text>
  <text x="75" y="294" fill="#a9bdc9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing=".6">YOUR MODELS  /  YOUR WORKSPACE  /  VISIBLE EVIDENCE</text>
  <g transform="translate(925 68)">
    <rect x="0" y="0" width="345" height="224" rx="19" fill="#101b29" stroke="#54727e" stroke-opacity=".55"/>
    <rect x="24" y="23" width="92" height="10" rx="5" fill="#435d6d"/>
    <circle cx="286" cy="28" r="4" fill="#5eead4"/><circle cx="302" cy="28" r="4" fill="#5b7482"/><circle cx="318" cy="28" r="4" fill="#5b7482"/>
    <rect x="24" y="56" width="140" height="67" rx="12" fill="#213646" stroke="#416276"/>
    <text x="40" y="84" fill="#cfe2e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">MODEL</text>
    <text x="40" y="106" fill="#87a9b6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">your choice</text>
    <rect x="181" y="56" width="140" height="67" rx="12" fill="#213646" stroke="#416276"/>
    <text x="197" y="84" fill="#cfe2e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">WORKSPACE</text>
    <text x="197" y="106" fill="#87a9b6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">your boundaries</text>
    <rect x="24" y="141" width="297" height="56" rx="12" fill="#193936" stroke="#39675f"/>
    <circle cx="45" cy="169" r="6" fill="#5eead4"/>
    <text x="61" y="174" fill="#c0e9df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Execution, context &amp; evidence</text>
  </g>
</svg>
