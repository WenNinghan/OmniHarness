[project]
name = "omniharness"
version = "0.1.0a1"
description = "A local-first, bring-your-own-model agent harness"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=44,<50",
  "httpx>=0.28,<1",
  "langchain-openai>=0.3,<2",
  "langchain-anthropic>=0.3,<2",
  "langchain-google-genai>=2,<5",
  "deepagents>=0.4,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "opensandbox==1.2.0",
  "mcp==2.1.0",
]

[project.scripts]
omniharness = "omniharness.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "langgraph-checkpoint-sqlite>=3,<4"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
