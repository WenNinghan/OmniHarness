# OpenSandbox 1.2.0. Template only; API key comes from an independent secret env file.
# M4 tools must stay disabled until the real baseline/auth/fault checks all pass.
# prepare substitutes inspected local image IDs; unbuilt placeholders must fail.
# Snapshot paths must be identical in the controller and Docker daemon namespace.
[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 1800

[proxy]
resolve_internal = false

[runtime]
type = "docker"
execd_image = "__M4_EXECD_IMAGE__"
execd_run_as_init = true

[storage]
allowed_host_paths = ["/var/lib/omniharness-m4a/snapshots"]

[store]
type = "sqlite"
path = "/var/lib/opensandbox/controller.db"

[docker]
network_mode = "bridge"
host_ip = "172.17.0.1"
publish_host = "172.17.0.1"
port_range_min = 41000
port_range_max = 41100
# Only the trusted execd has SETUID, SETGID, SETPCAP, KILL. Its native launcher
# strips all capability sets from every UID 10001 workload. Probe validates both.
drop_capabilities = ["CHOWN", "DAC_OVERRIDE", "DAC_READ_SEARCH", "FOWNER", "FSETID", "LINUX_IMMUTABLE", "NET_BIND_SERVICE", "NET_BROADCAST", "NET_ADMIN", "NET_RAW", "IPC_LOCK", "IPC_OWNER", "SYS_MODULE", "SYS_RAWIO", "SYS_CHROOT", "SYS_PTRACE", "SYS_PACCT", "SYS_ADMIN", "SYS_BOOT", "SYS_NICE", "SYS_RESOURCE", "SYS_TIME", "SYS_TTY_CONFIG", "MKNOD", "LEASE", "AUDIT_WRITE", "AUDIT_CONTROL", "SETFCAP", "MAC_OVERRIDE", "MAC_ADMIN", "SYSLOG", "WAKE_ALARM", "BLOCK_SUSPEND", "AUDIT_READ", "PERFMON", "BPF", "CHECKPOINT_RESTORE"]
no_new_privileges = true
pids_limit = 128
sandbox_binds = []
seccomp_profile = ""
apparmor_profile = ""

[ingress]
mode = "direct"

[egress]
image = "__M4_EGRESS_IMAGE__"
mode = "dns+nft"
readiness_timeout_seconds = 30.0

[renew_intent]
enabled = false

[log]
level = "INFO"
file_path = "/var/lib/opensandbox/server.log"
access_file_path = "/var/lib/opensandbox/access.log"
